name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: src/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -v